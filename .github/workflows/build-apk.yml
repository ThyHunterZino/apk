name: Build Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm install

      - name: Create the Android project
        run: npx cap add android

      - name: Copy the app into it
        run: npx cap sync android

      - name: Set App Icons
        run: |
          python3 -m pip install pillow
          python3 -c "
          from PIL import Image
          import os
          im = Image.open('www/icon.png').convert('RGBA')
          res_map = {'mipmap-mdpi': 48, 'mipmap-hdpi': 72, 'mipmap-xhdpi': 96, 'mipmap-xxhdpi': 144, 'mipmap-xxxhdpi': 192}
          base = 'android/app/src/main/res'
          for folder, sz in res_map.items():
              p = os.path.join(base, folder)
              if os.path.exists(p):
                  resized = im.resize((sz, sz), Image.Resampling.LANCZOS)
                  for name in ['ic_launcher.png', 'ic_launcher_round.png', 'ic_launcher_foreground.png']:
                      resized.save(os.path.join(p, name))
          "

      - name: Build the APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Upload the APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MonthlyChallenge-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Release APK
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: "v1.0.${{ github.run_number }}"
          name: "Monthly Challenge APK v1.0.${{ github.run_number }}"
          body: "Direct download for Monthly Challenge Android APK. Download app-debug.apk and install on your phone."
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
